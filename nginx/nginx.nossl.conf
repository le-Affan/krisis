upstream api {
    server api:8000;
}

# HTTP proxy — used when SSL certs are not yet provisioned
# Replace with the full HTTPS config (nginx.conf) once certs are in nginx/ssl/
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass  http://api/health;
        access_log  off;
    }
}
