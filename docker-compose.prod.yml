services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: abtest
      POSTGRES_PASSWORD: abtest_password
      POSTGRES_DB: abtest
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abtest"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://abtest:abtest_password@db:5432/abtest
      STORAGE_BACKEND: database
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - "scripts/init_db.sh && gunicorn src.api.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --access-logfile - --error-logfile -"

volumes:
  postgres_prod_data:
